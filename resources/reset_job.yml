resources:
  jobs:
    underwriting_99_reset:
      name: underwriting_99_reset
      description: "Reset demo: re-anchor dates (seed=42) → landing files → extraction → medallion full refresh → features → inbox re-score + governance re-seed → cache clear + hero verification. Models NOT retrained; crux fns NOT recreated."
      tags:
        project: underwriting_workbench
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: seed
          default: "42"
      environments:
        - environment_key: default
          spec:
            client: "5"
        - environment_key: ml
          spec:
            client: "5"
            dependencies:
              - databricks-feature-engineering
              - lightgbm
              - scikit-learn
              - mlflow
              - databricks-sdk
      tasks:
        - task_key: data_gen
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00_setup_and_data_generation.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}", seed: "{{job.parameters.seed}}"}
        - task_key: lane_e_setup
          depends_on: [{task_key: data_gen}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00c_lane_e_setup.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        # Referral Control: governed SCD2 rule registry (supersedes flat rule seeding in 00c/00d)
        - task_key: lane_e_registry
          depends_on: [{task_key: lane_e_setup}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00e_referral_registry.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        # Referral Control: fire-vector telemetry + backfill + future book + storylines (RNG 4245)
        - task_key: referral_telemetry
          depends_on: [{task_key: lane_e_registry}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00f_referral_telemetry.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        # Referral Control: detection pass (functions persist across reset; telemetry rebuilt by 00f)
        - task_key: referral_detection
          depends_on: [{task_key: referral_telemetry}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/07d_referral_detection.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: lane_e_source_feeds
          depends_on: [{task_key: lane_e_registry}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00d_source_feed_simulation.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: referral_conformance
          depends_on: [{task_key: lane_e_source_feeds}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.underwriting_referral_conformance.id}
            full_refresh: true
        - task_key: landing_files
          depends_on: [{task_key: lane_e_setup}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00b_landing_files.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: doc_extraction
          depends_on: [{task_key: landing_files}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01c_doc_extraction.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}", fm_endpoint: "${var.fm_endpoint}"}
        - task_key: wageroll_extraction
          depends_on: [{task_key: doc_extraction}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01d_wageroll_extraction.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}", fm_endpoint: "${var.fm_endpoint}"}
        - task_key: medallion
          depends_on: [{task_key: doc_extraction}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.underwriting_medallion.id}
            full_refresh: true
        - task_key: dq_scorecard
          depends_on: [{task_key: medallion}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03b_dq_scorecard.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: features
          depends_on: [{task_key: medallion}]
          environment_key: ml
          notebook_task:
            notebook_path: ../notebooks/04_features.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        # Lane E (additive): rebuild gold_referral_events from refreshed silver + generated history.
        # fn_referral_events_from_checks persists across reset (05d not re-run — grants).
        - task_key: gold_referral_events
          depends_on: [{task_key: dq_scorecard}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03c_gold_referral_events.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        # Lane E.2 (E8): top-up exemplars + rule effectiveness (runs before the metric view reads events)
        - task_key: rule_effectiveness
          depends_on: [{task_key: gold_referral_events}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/07b_rule_effectiveness.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: metric_views
          depends_on: [{task_key: rule_effectiveness}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/08_metric_views.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        # Lane E.2 (E9): AI tuning recommendations (reads effectiveness only)
        - task_key: rule_tuning_agent
          depends_on: [{task_key: metric_views}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/07c_rule_tuning_agent.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}", fm_endpoint: "${var.fm_endpoint}"}
        - task_key: inbox_rescore
          depends_on: [{task_key: features}]
          environment_key: ml
          notebook_task:
            notebook_path: ../notebooks/06_agent_tools.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}", mode: "score_only"}
        - task_key: governance_reseed
          depends_on: [{task_key: inbox_rescore}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/07_governance.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: decision_packs
          depends_on: [{task_key: governance_reseed}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/12_decision_packs.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
        - task_key: cache_reset
          depends_on: [{task_key: decision_packs}]
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/99_reset.py
            base_parameters: {catalog: "{{job.parameters.catalog}}", schema: "{{job.parameters.schema}}"}
