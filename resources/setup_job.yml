resources:
  jobs:
    underwriting_00_setup:
      name: underwriting_00_setup
      description: "Synthetic universe + bundled open data → landing + reference tables (deterministic, rolling dates)"
      tags:
        project: underwriting_workbench
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: seed
          default: "42"
      environments:
        - environment_key: default
          spec:
            client: "5"
      tasks:
        - task_key: data_gen
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00_setup_and_data_generation.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              seed: "{{job.parameters.seed}}"
        # Lane E (additive): referral/discretion reference + generated history, isolated RNG (4242)
        - task_key: lane_e_setup
          depends_on:
            - task_key: data_gen
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00c_lane_e_setup.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        # Referral Control: governed SCD2 rule registry (supersedes flat rule seeding in 00c/00d)
        - task_key: lane_e_registry
          depends_on:
            - task_key: lane_e_setup
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00e_referral_registry.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        # Lane E.1 (additive): rule landscape (E6) + simulated source feeds (E7), isolated RNG (4243)
        - task_key: lane_e_source_feeds
          depends_on:
            - task_key: lane_e_registry
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/00d_source_feed_simulation.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
        # Lane E.1: conform the raw feeds → silver_referral_events_conformed (real DLT lineage)
        - task_key: referral_conformance
          depends_on:
            - task_key: lane_e_source_feeds
          pipeline_task:
            pipeline_id: ${resources.pipelines.underwriting_referral_conformance.id}
            full_refresh: true
